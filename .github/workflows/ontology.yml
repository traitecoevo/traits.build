# Build, validate and render the data model (ontology/).
#
# R CMD check ignores ontology/ (it is in .Rbuildignore), so without this
# nothing exercised the data-model build. That is how the published model sat
# at 1.0.0 for sixteen months after 1.1.0 was built, and how a reference to a
# class missing from the published-classes table would have become the IRI
# <NA> in the RDF without anything noticing.
name: ontology

on:
  push:
    branches: [master, develop]
    paths:
      - "ontology/**"
      - "Makefile"
      - ".github/workflows/ontology.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "Makefile"
      - ".github/workflows/ontology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The data-model build is a maintainer tool, not part of the package, so
      # its packages are not in DESCRIPTION; ontology/scripts/setup.R is the
      # declaration and this list mirrors it. pak installs the system
      # libraries: rdflib needs redland, which is not on the runner image.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >-
            any::dplyr, any::tidyr, any::readr, any::stringr, any::tibble,
            any::purrr, any::rdflib, any::jsonld, any::yaml, any::gt,
            any::htmltools, any::knitr, any::rmarkdown, any::quarto,
            any::testthat, any::withr

      - name: Build the data model
        run: make ontology

      # The build reads ontology/data/ and must never write to it.
      - name: The build must not write to ontology/data/
        run: git diff --exit-code -- ontology/data

      # Validation, the RDF parse, and the tests, including test-golden.R,
      # which rebuilds into a temp directory and compares against the
      # committed artefacts. Known gaps are reported, not fatal; anything not
      # on the register in ontology/R/validate.R fails here.
      - name: Validate and test
        run: make ontology-check

      # Rendering is what proves every term has an anchor on the page.
      - name: Render the page
        run: make ontology-site
