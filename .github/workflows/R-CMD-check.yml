# additional example workflows available for the R community.

name: R-CMD-check

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

# A new push to a PR supersedes the run already in flight for it. Pushes to
# master/develop each get their own group (run_id): GitHub cancels any older
# *pending* run in a shared group even without cancel-in-progress, which
# would skip checks on intermediate commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        # Release R only. R-devel was dropped: no binary packages exist for it,
        # so every dependency compiled from source (~50 min, vs ~5 min for the
        # rest of the matrix), and r-universe already checks on R-devel (#217).
        # `build (macOS-latest, release)` is a required check on `develop`;
        # renaming it blocks merges until branch protection is updated.
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v5
      
      - uses: r-lib/actions/setup-pandoc@v2

      # Report rendering (`dataset_report()`) shells out to the Quarto CLI;
      # without this the "reports and plots are produced" test just skips.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          extra-packages: local::., any::rcmdcheck, any::remotes
          needs: check

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'
          upload-snapshots: true
