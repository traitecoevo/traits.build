name: R-CMD-check

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # `DESCRIPTION` declares R (>= 4.3.0); without this nothing exercises it.
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # Catches upstream R changes here rather than on r-universe (see #217).
          # terra 1.9-50, the CRAN version, fails to install on R-devel (its
          # `median` method adds arguments the generic no longer has), and
          # leaflet -> raster -> terra needs it. The fix (rspatial/terra#2229) is
          # in terra's r-universe build, so take terra from there until a fixed
          # terra is on CRAN, then remove `extra-repositories`.
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', extra-repositories: 'https://rspatial.r-universe.dev'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v5
      
      - uses: r-lib/actions/setup-pandoc@v2

      # Report rendering (`dataset_report()`) shells out to the Quarto CLI;
      # without this the "reports and plots are produced" test just skips.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: ${{ matrix.config.extra-repositories }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          extra-packages: local::., any::rcmdcheck, any::remotes
          needs: check

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'
          upload-snapshots: true
